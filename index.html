<!-- Rahul Kumar - Auficionado Front-End -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auficionado Audiobooks</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="light-mode">
  <header>
    <h1>Auficionado Audiobooks</h1>
    <p class="subtitle">Discover audiobooks powered by Open Library</p>

    <button id="dark-mode-toggle" class="dark-toggle">🌙 Dark Mode</button>
  </header>

  <main>
    <section class="controls">
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          placeholder="Search audiobooks by title or author..."
        />
        <button id="search-button">Search</button>
      </div>

      <div class="tabs" id="category-tabs">
        <button class="tab active" data-category="all">All</button>
        <button class="tab" data-category="fiction">Fiction</button>
        <button class="tab" data-category="nonfiction">Nonfiction</button>
        <button class="tab" data-category="science">Science</button>
        <button class="tab" data-category="history">History</button>
      </div>
    </section>

    <div id="loader" class="loader"></div>
    <div id="audiobook-list" class="grid"></div>

    <button id="load-more" class="load-more">Load More</button>
  </main>

  <!-- ⭐ Detail Modal -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-content">
      <span id="modal-close" class="modal-close">&times;</span>
      <img id="modal-cover" class="modal-cover" />
      <h2 id="modal-title"></h2>
      <p id="modal-author"></p>
      <p id="modal-year"></p>
      <p id="modal-description"></p>

      <!-- ⭐ Audio Player Mock-Up -->
      <div class="audio-player">
        <button class="audio-btn">▶ Play Sample</button>
        <div class="audio-bar">
          <div class="audio-progress"></div>
        </div>
      </div>

      <!-- ⭐ Favorites Button -->
      <button id="favorite-btn" class="favorite-btn">⭐ Add to Favorites</button>
    </div>
  </div>

  <!-- ⭐ Favorites Sidebar -->
  <aside id="favorites-panel" class="favorites-panel hidden">
    <h3>Your Favorites</h3>
    <div id="favorites-list"></div>
  </aside>

  <footer>
    <p>© 2026 Auficionado Prototype</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
