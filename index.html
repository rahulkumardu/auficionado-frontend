<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auficionado Audiobooks</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <h1>Auficionado Audiobooks</h1>
    <p class="subtitle">Discover audiobooks powered by Open Library</p>
  </header>

  <main>
    <section class="controls">
      <div class="search-bar">
        <input
          type="text"
          id="search-input"
          placeholder="Search audiobooks by title or author..."
        />
        <button id="search-button">Search</button>
      </div>

      <div class="tabs" id="category-tabs">
        <button class="tab active" data-category="all">All</button>
        <button class="tab" data-category="fiction">Fiction</button>
        <button class="tab" data-category="nonfiction">Nonfiction</button>
        <button class="tab" data-category="science">Science</button>
        <button class="tab" data-category="history">History</button>
      </div>
    </section>

    <div id="loader" class="loader"></div>
    <div id="audiobook-list" class="grid"></div>
  </main>

  <footer>
    <p>© 2026 Auficionado Prototype</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
