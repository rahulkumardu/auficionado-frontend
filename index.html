<!-- Rahul Kumar - Auficionado Front-End -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auficionado Audiobooks</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="light-mode">

  <header>
    <h1>Auficionado</h1>

    <div class="search-bar">
      <input id="search-input" type="text" placeholder="Search audiobooks..." />
      <button id="search-button">Search</button>
    </div>

    <button id="dark-mode-toggle">Toggle Dark Mode</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-category="all">All</button>
    <button class="tab" data-category="fiction">Fiction</button>
    <button class="tab" data-category="nonfiction">Nonfiction</button>
    <button class="tab" data-category="science">Science</button>
    <button class="tab" data-category="history">History</button>
  </nav>

  <div id="loader" class="loader">Loading...</div>

  <section id="audiobook-list" class="audiobook-list"></section>

  <section id="favorites-panel" class="favorites hidden">
    <h2>Favorites</h2>
    <div id="favorites-list" class="favorites-list"></div>
  </section>

  <div id="detail-modal" class="modal hidden">
    <div class="modal-content">
      <span id="modal-close" class="close">&times;</span>
      <img id="modal-cover" class="modal-cover" />
      <h2 id="modal-title"></h2>
      <p id="modal-author"></p>
      <p id="modal-year"></p>
      <p id="modal-description"></p>

      <audio id="modal-audio" controls>
        <source id="modal-audio-src" src="" type="audio/mpeg" />
      </audio>

      <button id="favorite-btn" class="favorite-btn">Add to Favorites</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
